<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    src: url("../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  /* The site's light tokens (src/app/globals.css). */
  :root {
    --bg: oklch(0.994 0.003 300);
    --ink: oklch(0.185 0.022 296);
    --muted: oklch(0.53 0.022 296);
    --line: oklch(0.912 0.008 300);
    --tint: oklch(0.965 0.008 300);
    --primary: oklch(0.53 0.22 295);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .copy {
    position: absolute; left: 72px; top: 64px; bottom: 60px; width: {{copyWidth}}px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .brand img { width: 56px; height: 56px; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-size: {{titleSize}}px; line-height: 1.02; font-weight: 600; letter-spacing: -0.04em;
    text-wrap: balance;
  }
  p { margin-top: 22px; font-size: 26px; line-height: 1.4; color: var(--muted); text-wrap: pretty; }
  .url { font-size: 20px; color: var(--muted); letter-spacing: 0.005em; }
  .url b { color: var(--primary); font-weight: 500; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--primary); }
  .shot { position: absolute; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: #fff;
          box-shadow: 0 30px 60px -20px oklch(0.185 0.022 296 / 0.35); }
  .shot img { display: block; width: 100%; }
  .wide { left: 640px; top: 120px; width: 640px; transform: rotate(-3deg); transform-origin: top left; }
  .tall { left: 960px; top: 250px; width: 190px; transform: rotate(3deg); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="jj-logo.svg" alt="">Jupiter Jots</div>
    <div class="main">
      <h1>{{title}}</h1>
      <p>{{body}}</p>
    </div>
    <div class="url">{{host}}<b>{{path}}</b></div>
  </div>
  {{visual}}
  <div class="rule"></div>
</body>
</html>
